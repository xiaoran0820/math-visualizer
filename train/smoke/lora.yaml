model: smoke/tiny
train: true
data: data/mlx
fine_tune_type: lora
mask_prompt: true
num_layers: -1
batch_size: 2
iters: 4
learning_rate: 1.0e-4
steps_per_report: 1
steps_per_eval: 1000
val_batches: 2
max_seq_length: 1024
grad_checkpoint: true
adapter_path: smoke/adapter
lora_parameters:
  keys: ["mlp.gate_proj", "mlp.up_proj", "mlp.down_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
  rank: 16
  scale: 20.0
  dropout: 0.0
