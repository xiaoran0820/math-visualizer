# 第三版：“看图识别”的 LoRA（mlx-vlm）。在 train/ 目录下运行：
#   .venv/bin/python train_ocr.py -c lora-ocr.yaml
# 只训练语言部分（视觉部分不动）；只对回答（识别结果）算损失；缩放 alpha/rank = 20，和作图的 LoRA 一样。
model: base/Qwen3.5-2B
data: data/ocr
validation_split: valid
train_type: lora
lora_rank: 16
lora_alpha: 320
lora_dropout: 0.0
target_modules: [gate_proj, up_proj, down_proj, q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj]
learning_rate: 3.0e-5
batch_size: 1
gradient_accumulation_steps: 4
iters: 2000            # 训练图片 2000 张，一轮
steps_per_report: 20
steps_per_eval: 250
val_batches: 25
steps_per_save: 500
max_seq_length: 2048
train_on_completions: true
output_path: adapters/ocr-v1
seed: 0
