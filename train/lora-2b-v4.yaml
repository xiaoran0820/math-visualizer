# 第四版：Qwen3.5-2B 作图（分析题意）的 LoRA。在第三版的 41 类题型上加 5 类（主攻需要画图的题，见 gen/more5.js）：
# 复数的极形式（旋转、对称、乘方）、坐标里带参数的立体、积分定义的函数、圆上的点（等弦、直径、弦心距）、含根式的代数题（列表格）。
# 另外老题型的日文写法都改成了真的日文（2026-11-13）。数据：gen/dataset.js 30 17 → data/mlx-v4。
#   .venv/bin/python train_lora.py -c lora-2b-v4.yaml
model: base/Qwen3.5-2B
train: true
data: data/mlx-v4
fine_tune_type: lora
mask_prompt: true          # 只对答案部分算损失（系统提示和题目不算）
num_layers: -1             # 全部 24 层
batch_size: 4
iters: 924                 # 训练样本 3695 条，约 1 轮
learning_rate: 3.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 30
  warmup_init: 1.0e-7
  arguments: [3.0e-5, 924, 1.0e-6]
steps_per_report: 20
steps_per_eval: 231
val_batches: 20
save_every: 231            # 中间的版本也留着
max_seq_length: 1280
grad_checkpoint: false     # 用了分块算法后内存够用，不需要用时间换内存
adapter_path: adapters/2b-v4
seed: 0
lora_parameters:
  # 全注意力层（6 层）：q、k、v、o；循环层（18 层）：输入投影 qkv、门控 z、输出投影；所有层的 MLP
  keys: ["mlp.gate_proj", "mlp.up_proj", "mlp.down_proj",
         "self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "linear_attn.in_proj_qkv", "linear_attn.in_proj_z", "linear_attn.out_proj"]
  rank: 16
  scale: 20.0
  dropout: 0.0
