# Qwen3.5-2B 的 LoRA 微调配置（MLX）。在 train/ 目录下运行：
#   .venv/bin/python train_lora.py -c lora-2b.yaml      （train_lora.py 把循环层换成分块并行算法，快约 5 倍）
# 开始前先跑 verify_mapping.py：确认下面 keys 里的层和 GGUF 里的张量一一对应（2026-11-11 核对通过，相关系数都在 0.996 以上）。
model: base/Qwen3.5-2B
train: true
data: data/mlx
fine_tune_type: lora
mask_prompt: true          # 只对答案部分算损失（系统提示和题目不算）
num_layers: -1             # 全部 24 层
batch_size: 4
iters: 520                 # 训练样本 2054 条，约 1 轮（合成数据学得很快，轮数多了容易只会背模板）
learning_rate: 3.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 30
  warmup_init: 1.0e-7
  arguments: [3.0e-5, 520, 1.0e-6]
steps_per_report: 20
steps_per_eval: 130
val_batches: 20
save_every: 130            # 中间的版本也留着，评测时挑最好的
max_seq_length: 1280
grad_checkpoint: false     # 用了分块算法后内存够用，不需要用时间换内存
adapter_path: adapters/2b-v1
seed: 0
lora_parameters:
  # 全注意力层（6 层）：q、k、v、o；循环层（18 层）：输入投影 qkv、门控 z、输出投影；所有层的 MLP
  keys: ["mlp.gate_proj", "mlp.up_proj", "mlp.down_proj",
         "self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "linear_attn.in_proj_qkv", "linear_attn.in_proj_z", "linear_attn.out_proj"]
  rank: 16
  scale: 20.0
  dropout: 0.0
