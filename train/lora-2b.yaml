# Qwen3.5-2B 的 LoRA 微调配置（MLX）。在 train/ 目录下运行：
#   .venv/bin/python -m mlx_lm lora -c lora-2b.yaml
# 开始前先跑 verify_mapping.py：确认下面 keys 里的层和 GGUF 里的张量一一对应（k_proj、linear_attn.out_proj 核对通过后再加进来）。
model: base/Qwen3.5-2B
train: true
data: data/mlx
fine_tune_type: lora
mask_prompt: true          # 只对答案部分算损失（系统提示和题目不算）
num_layers: -1             # 全部 24 层
batch_size: 4
iters: 1200                # 训练样本 2477 条，约 2 轮
learning_rate: 3.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-7
  arguments: [3.0e-5, 1200, 1.0e-6]
steps_per_report: 20
steps_per_eval: 200
val_batches: 30
save_every: 200
max_seq_length: 1024
grad_checkpoint: true
adapter_path: adapters/2b-v1
seed: 0
lora_parameters:
  keys: ["mlp.gate_proj", "mlp.up_proj", "mlp.down_proj", "self_attn.v_proj", "self_attn.o_proj"]
  rank: 16
  scale: 20.0
  dropout: 0.0
